<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Team</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #fff; --text: #1c2330; --muted: #677285; --line: #e2e6ec; --accent: #3b5bdb;
    --triaging: #ae3ec9; --queued: #868e96; --running: #1c7ed6; --done: #2f9e44; --failed: #e03131; --cancelled: #f08c00;
    --code: #f1f3f5;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #111418; --panel: #1a1e24; --text: #e6e9ee; --muted: #8b95a5; --line: #2b313a; --accent: #748ffc; --code: #22272e; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.45 system-ui, -apple-system, Segoe UI, sans-serif; background: var(--bg); color: var(--text); }
  header { display: flex; align-items: center; gap: 16px; padding: 12px 20px; border-bottom: 1px solid var(--line); background: var(--panel); flex-wrap: wrap; }
  header h1 { font-size: 16px; margin: 0; }
  header .info { color: var(--muted); font-size: 12px; margin-left: auto; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip { border: 1px solid var(--line); background: var(--panel); color: var(--text); border-radius: 999px; padding: 3px 10px; cursor: pointer; font-size: 12px; }
  .chip.active { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
  .chip b { margin-left: 4px; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 5px; vertical-align: middle; }
  main { display: grid; grid-template-columns: minmax(380px, 1fr) 1.2fr; gap: 16px; padding: 16px 20px; height: calc(100vh - 58px); }
  .col { display: flex; flex-direction: column; gap: 12px; min-height: 0; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px; }
  textarea { width: 100%; min-height: 72px; resize: vertical; font: inherit; padding: 8px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--text); }
  button { font: inherit; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); color: var(--text); padding: 6px 12px; cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button:disabled { opacity: .5; cursor: default; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  select, input[type=search] { font: inherit; padding: 5px 8px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); color: var(--text); }
  input[type=search] { flex: 1; min-width: 120px; }
  .list { overflow-y: auto; flex: 1; padding: 0; }
  .task { padding: 10px 12px; border-bottom: 1px solid var(--line); cursor: pointer; }
  .task:hover { background: var(--bg); }
  .task.sel { background: var(--bg); box-shadow: inset 3px 0 0 var(--accent); }
  .task .t { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .task .m { color: var(--muted); font-size: 12px; display: flex; gap: 10px; flex-wrap: wrap; margin-top: 2px; }
  .badge { font-size: 11px; padding: 1px 7px; border-radius: 999px; color: #fff; text-transform: uppercase; letter-spacing: .03em; }
  .detail { overflow-y: auto; flex: 1; }
  .detail h2 { font-size: 16px; margin: 0 0 6px; }
  .kv { display: grid; grid-template-columns: 110px 1fr; gap: 4px 12px; font-size: 13px; margin: 10px 0; }
  .kv dt { color: var(--muted); }
  .kv dd { margin: 0; }
  details { border-top: 1px solid var(--line); padding: 8px 0; }
  summary { cursor: pointer; font-weight: 600; }
  pre { white-space: pre-wrap; word-break: break-word; background: var(--code); padding: 10px; border-radius: 8px; font: 12.5px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace; margin: 8px 0 0; max-height: 420px; overflow: auto; }
  .ev { font: 12px/1.4 ui-monospace, monospace; padding: 4px 0; border-bottom: 1px dashed var(--line); white-space: pre-wrap; word-break: break-word; }
  .ev .a { font-weight: 700; }
  .ev.tool { color: var(--muted); }
  .ev.error { color: var(--failed); }
  .empty { color: var(--muted); padding: 24px; text-align: center; }
  .err { color: var(--failed); }
  @media (max-width: 860px) { main { grid-template-columns: 1fr; height: auto; } .list, .detail { max-height: 60vh; } }
</style>
</head>
<body>
<header>
  <h1>AI Team</h1>
  <div class="chips" id="counts"></div>
  <div class="info" id="info"></div>
</header>
<main>
  <section class="col">
    <form class="card" id="new">
      <textarea id="text" placeholder="Describe a task in plain words… e.g. “In exercise_planner, add a dark-mode toggle to the settings page”"></textarea>
      <div class="row" style="justify-content: space-between; margin-top: 8px;">
        <span class="info" style="color: var(--muted); font-size: 12px;">Ctrl+Enter to submit · triage picks project, type, agents &amp; model</span>
        <button class="primary" id="submit">Queue task</button>
      </div>
    </form>
    <div class="row">
      <select id="f-status"><option value="">All statuses</option></select>
      <select id="f-type"><option value="">All types</option></select>
      <select id="f-project"><option value="">All projects</option></select>
      <input type="search" id="f-q" placeholder="Search…">
    </div>
    <div class="card list" id="list"></div>
  </section>
  <section class="col">
    <div class="card detail" id="detail"><div class="empty">Select a task to see its plan, work, review and live log.</div></div>
  </section>
</main>
<script>
const STATUSES = ["triaging", "queued", "running", "done", "failed", "cancelled"];
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const badge = (s) => `<span class="badge" style="background: var(--${s})">${s}</span>`;
const ago = (iso) => { if (!iso) return ""; const s = (Date.now() - new Date(iso)) / 1000;
  return s < 60 ? `${s | 0}s ago` : s < 3600 ? `${(s / 60) | 0}m ago` : s < 86400 ? `${(s / 3600) | 0}h ago` : new Date(iso).toLocaleDateString(); };
const dur = (a, b) => { if (!a) return ""; const s = ((b ? new Date(b) : Date.now()) - new Date(a)) / 1000; return s < 60 ? `${s | 0}s` : `${(s / 60) | 0}m ${(s % 60) | 0}s`; };

let selected = null, lastEventId = 0, eventsFor = null;
STATUSES.forEach((s) => $("f-status").insertAdjacentHTML("beforeend", `<option>${s}</option>`));

async function api(path, opts) {
  const r = await fetch(path, opts);
  if (!r.ok) throw new Error((await r.json().catch(() => ({}))).detail || r.statusText);
  return r.json();
}

function fillSelect(el, values) {
  const cur = el.value, first = el.options[0].outerHTML;
  el.innerHTML = first + values.map((v) => `<option ${v === cur ? "selected" : ""}>${esc(v)}</option>`).join("");
}

async function refreshMeta() {
  const m = await api("/api/meta");
  $("counts").innerHTML = STATUSES.map((s) =>
    `<span class="chip ${$("f-status").value === s ? "active" : ""}" data-s="${s}"><span class="dot" style="background: var(--${s})"></span>${s}<b>${m.counts[s]}</b></span>`).join("");
  $("info").textContent = `provider: ${m.provider} · parallel: ${m.max_parallel} · workspace: ${m.workspace_root}`;
  fillSelect($("f-type"), m.task_types);
  fillSelect($("f-project"), [...new Set([...m.projects, "general"])]);
}

async function refreshList() {
  const p = new URLSearchParams();
  [["status", "f-status"], ["task_type", "f-type"], ["project", "f-project"], ["q", "f-q"]].forEach(([k, id]) => $(id).value && p.set(k, $(id).value));
  const tasks = await api("/api/tasks?" + p);
  $("list").innerHTML = tasks.length ? tasks.map((t) => {
    const m = t.metadata || {};
    return `<div class="task ${t.id === selected ? "sel" : ""}" data-id="${t.id}">
      <div class="t">#${t.id} ${esc(m.title || t.text)}</div>
      <div class="m">${badge(t.status)}<span>${esc(t.project || "—")}</span><span>${esc(t.task_type || "")}</span>
        <span>${esc((m.workflow || []).join(" → "))}</span><span>${esc(m.model_tier || "")}</span><span>${ago(t.created_at)}</span></div>
    </div>`;
  }).join("") : `<div class="empty">No tasks match.</div>`;
}

function section(title, body, open) {
  return body ? `<details ${open ? "open" : ""}><summary>${title}</summary><pre>${esc(body)}</pre></details>` : "";
}

async function refreshDetail() {
  if (!selected) return;
  const t = await api(`/api/tasks/${selected}`);
  const m = t.metadata || {};
  const actions = [];
  if (["triaging", "queued", "running"].includes(t.status)) actions.push(`<button data-act="cancel">Cancel</button>`);
  if (["failed", "cancelled", "done"].includes(t.status)) actions.push(`<button data-act="retry">Retry</button>`);
  const openKeys = [...document.querySelectorAll("#detail details[open] summary")].map((s) => s.textContent);
  const isOpen = (k, d) => openKeys.length ? openKeys.includes(k) : d;
  if (eventsFor !== t.id) { eventsFor = t.id; lastEventId = 0; }
  const keepLog = lastEventId ? $("log")?.innerHTML : "";
  $("detail").innerHTML = `
    <div class="row" style="justify-content: space-between;"><h2>#${t.id} ${esc(m.title || "")}</h2><div class="row">${actions.join("")}</div></div>
    <div>${esc(t.text)}</div>
    <dl class="kv">
      <dt>Status</dt><dd>${badge(t.status)} ${t.error ? `<span class="err">${esc(t.error)}</span>` : ""}</dd>
      <dt>Project</dt><dd>${esc(t.project || "—")}</dd>
      <dt>Type</dt><dd>${esc(t.task_type || "—")} ${m.work_kind ? `· ${esc(m.work_kind)}` : ""} ${m.complexity ? `· ${esc(m.complexity)} complexity` : ""}</dd>
      <dt>Agents</dt><dd>${esc((m.workflow || []).join(" → ") || "—")}</dd>
      <dt>Model</dt><dd>${esc(m.model_tier || "—")} ${m.model ? `(${esc(m.provider)}: ${esc(m.model)})` : ""}</dd>
      <dt>Why</dt><dd>${esc(m.rationale || "—")}</dd>
      <dt>Timing</dt><dd>created ${ago(t.created_at)}${t.started_at ? ` · ran ${dur(t.started_at, t.finished_at)}` : ""}</dd>
    </dl>
    ${section("Plan", t.plan, isOpen("Plan", false))}
    ${section("Developer summary", t.result, isOpen("Developer summary", false))}
    ${section("Review", t.review, isOpen("Review", false))}
    <details open><summary>Activity log</summary><div id="log">${keepLog}</div></details>`;
  const evs = await api(`/api/tasks/${t.id}/events?after=${lastEventId}`);
  for (const e of evs) {
    $("log").insertAdjacentHTML("beforeend",
      `<div class="ev ${e.kind}"><span style="color: var(--muted)">${new Date(e.ts).toLocaleTimeString()}</span> <span class="a">${esc(e.agent)}</span> ${esc(e.content)}</div>`);
    lastEventId = e.id;
  }
}

async function tick() {
  try { await Promise.all([refreshMeta(), refreshList(), refreshDetail()]); }
  catch (e) { $("info").textContent = "⚠ " + e.message; }
}

$("new").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const text = $("text").value.trim();
  if (!text) return;
  $("submit").disabled = true;
  try { const t = await api("/api/tasks", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ text }) });
        $("text").value = ""; selected = t.id; await tick(); }
  catch (e) { alert(e.message); }
  finally { $("submit").disabled = false; }
});
$("text").addEventListener("keydown", (e) => { if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) $("new").requestSubmit(); });
$("list").addEventListener("click", (e) => { const el = e.target.closest(".task"); if (el) { selected = +el.dataset.id; tick(); } });
$("counts").addEventListener("click", (e) => { const c = e.target.closest(".chip"); if (c) { $("f-status").value = $("f-status").value === c.dataset.s ? "" : c.dataset.s; tick(); } });
["f-status", "f-type", "f-project"].forEach((id) => $(id).addEventListener("change", tick));
$("f-q").addEventListener("input", () => { clearTimeout(window._q); window._q = setTimeout(tick, 250); });
$("detail").addEventListener("click", async (e) => {
  const act = e.target.dataset?.act;
  if (!act) return;
  try { await api(`/api/tasks/${selected}/${act}`, { method: "POST" }); if (act === "retry") lastEventId = 0, eventsFor = null; await tick(); }
  catch (err) { $("info").textContent = "⚠ " + err.message; }
});
tick();
setInterval(tick, 2500);
</script>
</body>
</html>
